name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uptimehq
          POSTGRES_PASSWORD: uptimehq
          POSTGRES_DB: uptimehq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uptimehq"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://uptimehq:uptimehq@localhost:5432/uptimehq_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  testlab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testlab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  # Builds all images. On a push to main it also publishes them to GitHub Container Registry,
  # tagged with the commit SHA (what production deploys) and "latest".
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, testlab]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci docker compose config --quiet
      - name: Check publishable key
        if: env.PUBLISH == 'true'
        run: |
          if [ -z "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the repository variable CLERK_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/uptimehq-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/uptimehq-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ env.CLERK_PUBLISHABLE_KEY }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/uptimehq-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/uptimehq-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Not published: the server builds this copy-only image itself.
      - name: Test lab image
        uses: docker/build-push-action@v7
        with:
          context: ./testlab
          push: false

  # Continuous deployment: runs only after every job above passes on a push to main.
  # The server checks out this exact commit and pulls the images tagged with its SHA.
  # Needs repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS
  # (see README "Continuous deployment"). Skipped automatically when they are not set.
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://uptimehq.ashutoshdev.online
    # Never run two deploys at once; a newer push waits for the current one.
    concurrency:
      group: production
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Deploy secrets are not configured; skipping deployment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy over SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd ~/uptimehq && git fetch --prune origin main && git reset --hard $GITHUB_SHA && DEPLOY_SHA=$GITHUB_SHA bash scripts/deploy.sh"
      - name: Smoke test
        if: steps.check.outputs.enabled == 'true'
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 https://uptimehq.ashutoshdev.online/api/health; then echo; exit 0; fi
            sleep 10
          done
          echo "Health check failed after deploy" >&2
          exit 1
