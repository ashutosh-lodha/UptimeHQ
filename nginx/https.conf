# HTTPS configuration (see README "HTTPS").
# Rendered by the nginx image's template step: ${DOMAIN} comes from DOMAIN in .env.
# Enable it by setting NGINX_CONF=https.conf in .env once certificates exist in ./certbot/conf.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream api_upstream { server api:4000; }
upstream frontend_upstream { server frontend:8080; }

server {
  listen 80;
  server_name ${DOMAIN};
  server_tokens off;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location = /nginx-health { access_log off; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMAIN};
  server_tokens off;
  client_max_body_size 256k;

  ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Clerk: its JS and API are served from the Frontend API domain (*.clerk.accounts.dev in development;
  # add your production clerk.<your-domain> here), avatars from img.clerk.com, bot protection from Cloudflare Turnstile.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://img.clerk.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://clerk.ashutoshdev.online https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; connect-src 'self' https://clerk.ashutoshdev.online https://*.clerk.accounts.dev https://*.clerk.com https://clerk-telemetry.com; frame-src https://clerk.ashutoshdev.online https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'" always;

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params.conf;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy_params.conf;
  }
  location / {
    proxy_pass http://frontend_upstream;
    include /etc/nginx/proxy_params.conf;
  }
}
